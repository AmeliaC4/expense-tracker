name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test API
        run: ./mvnw -B package
        working-directory: expense-api

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: expense-tracker-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: expense-tracker-ui
      - name: Build UI
        run: npm run build
        working-directory: expense-tracker-ui