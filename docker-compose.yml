services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: expenses
    volumes:
      - dbdata:/var/lib/postgresql

  api:
    image: expense-api
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/expenses
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost
    ports:
      - "8080:8080"
    depends_on:
      - db

  ui:
    image: expense-ui
    ports:
      - "80:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  dbdata:
  grafanadata: