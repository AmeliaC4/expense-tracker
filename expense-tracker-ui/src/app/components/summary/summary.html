<h2>Monthly Summary</h2>

<label>Month:
    <input type="month" [(ngModel)]="month" (change)="load()" />
</label>

<table>
  <thead>
    <tr><th>Category</th><th>Total</th></tr>
  </thead>
  <tbody>
    @for (row of rows(); track row.categoryName) {
      <tr>
        <td>{{ row.categoryName }}</td>
        <td>{{ row.total }}</td>
      </tr>
    } @empty {
      <tr><td colspan="2">No expenses this month.</td></tr>
    }
  </tbody>
  <tfoot>
    <tr><th>Total</th><th>{{ grandTotal() }}</th></tr>
  </tfoot>
</table>]
