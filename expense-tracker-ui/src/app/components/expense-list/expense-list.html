<h1>My Expenses</h1>
<a routerLink="/expenses/new">+ Add expense</a>
<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Description</th>
      <th>Category</th>
      <th>Amount</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (expense of expenses(); track expense.id) {
      <tr>
        <td>{{ expense.expenseDate }}</td>
        <td>{{ expense.description}}</td>
        <td>{{ expense.category.name}}</td>
        <td>{{ expense.amount | currency: 'ZAR': 'symbol-narrow' }}</td>
        <td><a [routerLink]="['/expenses', expense.id, 'edit']">Edit</a>
        <button (click)="deleteExpense(expense)">Delete</button>
      </td>

      </tr>
    }
  </tbody>
</table>
