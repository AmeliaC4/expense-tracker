<h1>My Expenses</h1>

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Description</th>
      <th>Category</th>
      <th>Amount</th>
    </tr>
  </thead>
  <tbody>
    @for (expense of expenses(); track expense.id) {
      <tr>
        <td>{{ expense.expenseDate }}</td>
        <td>{{ expense.description}}</td>
        <td>{{ expense.category.name}}</td>
        <td>{{ expense.amount }}</td>
        <td><button (click)="deleteExpense(expense)">Delete</button></td>

      </tr>
    }
  </tbody>
</table>
